<%+cbi/valueheader%>
<style>
#cbi-openfi .of-curve {max-width:850px}
#cbi-openfi .of-curve-head {display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}
#cbi-openfi .of-curve-head strong {font-size:15px}
#cbi-openfi .of-curve svg {display:block;touch-action:none;user-select:none}
#cbi-openfi .of-handle {cursor:grab;fill:#fff;stroke:#0c8277;stroke-width:3}
#cbi-openfi .of-handle:focus {outline:none;stroke:#173f72;stroke-width:5}
#cbi-openfi .of-handle:active {cursor:grabbing}
#cbi-openfi .of-point-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
#cbi-openfi .of-point-card {border:1px solid var(--of-line);border-radius:10px;padding:12px}
#cbi-openfi .of-point-card strong {display:block;margin-bottom:10px;color:var(--of-accent)}
#cbi-openfi .of-point-card label {display:flex;align-items:center;gap:6px;margin:7px 0;font-size:12px}
#cbi-openfi .of-point-card input {width:64px;min-width:0}
#cbi-openfi .of-curve-error {color:#b54736;min-height:1.5em;font-size:13px}
#cbi-openfi .of-curve-toolbar button {padding:7px 12px}
@media(max-width:600px) {#cbi-openfi .of-point-grid {grid-template-columns:repeat(2,minmax(0,1fr))}#cbi-openfi .of-curve-head{display:block}}
</style>
<div class="of-curve" id="of-editor">
 <div class="of-curve-head"><strong>四点 CPU 温控曲线</strong><span id="of-selected">拖动圆点，或在下方输入数值</span></div>
 <svg id="of-curve-svg" viewBox="0 0 760 340" aria-label="四点风扇曲线编辑器">
  <g id="of-grid"></g>
  <path id="of-floor-line" fill="none" stroke="#9babb6" stroke-dasharray="3 5"/>
  <path id="of-safety-line" fill="none" stroke="#bd6854" stroke-dasharray="6 5"/>
  <text id="of-safety-label" y="22" text-anchor="end">全速保护</text>
  <path id="of-curve-fill" fill="rgba(12,130,119,.08)"/>
  <path id="of-curve-path" fill="none" stroke="#0c8277" stroke-width="3" stroke-linejoin="round"/>
  <g id="of-points"></g>
  <text x="390" y="329" text-anchor="middle">CPU 温度（°C）</text>
  <text x="8" y="18">PWM 输出</text>
 </svg>
 <div class="of-point-grid">
 <% for i=1,4 do %>
  <div class="of-point-card"><strong>基准点 <%=i%></strong>
   <label>温度 <input type="number" id="of-temp<%=i%>" min="20" max="95" step="1" aria-label="基准点 <%=i%> 温度" /> °C</label>
   <label>输出 <input type="number" id="of-speed<%=i%>" min="5" max="100" step="1" aria-label="基准点 <%=i%> 输出" /> %</label>
  </div>
 <% end %>
 </div>
 <div id="of-curve-error" class="of-curve-error" role="status" aria-live="polite"></div>
 <p>左右拖动调温度，上下拖动调输出，支持触屏。选中圆点后也可用方向键微调，按住 Shift 每次调整 5 个单位。</p>
 <p>相邻温度点至少相隔 2°C；升温时输出只保持或增加。图中数值是待保存配置，保存并应用后才会控制风扇。</p>
 <p id="of-curve-caption"></p>
</div>
<script type="text/javascript">
(function() {
 'use strict';
 function start() {
  var svg=document.getElementById('of-curve-svg'), editor=document.getElementById('of-editor');
  var ns='http://www.w3.org/2000/svg', selected=0, drag=null;
  var defaultsT=[55,58,61,65], defaultsS=[55,70,85,100];
  function el(id) {return document.getElementById(id);}
  function field(name) {return el('cbid.openfi.fan.'+name);}
  function number(name, fallback) {
   var f=field(name);
   return f ? (f.value.trim()==='' ? NaN : Number(f.value)) : fallback;
  }
  function x(t) {return 62+(t-20)*8.175;}
  function y(s) {return 276-s*2.4;}
  function node(tag,attrs,parent) {
   var n=document.createElementNS(ns,tag);
   Object.keys(attrs).forEach(function(k){n.setAttribute(k,attrs[k]);});
   parent.appendChild(n);return n;
  }
  var handles=[];
  for(var t=20;t<=100;t+=10) {
   node('path',{d:'M'+x(t)+' 36V276',stroke:'currentColor',opacity:'.09'},el('of-grid'));
   node('text',{x:x(t),y:299,'text-anchor':'middle'},el('of-grid')).textContent=t;
  }
  for(var s=0;s<=100;s+=25) {
   node('path',{d:'M62 '+y(s)+'H716',stroke:'currentColor',opacity:'.09'},el('of-grid'));
   node('text',{x:52,y:y(s)+4,'text-anchor':'end'},el('of-grid')).textContent=s+'%';
  }
  function points() {
   return defaultsT.map(function(v,i){return {t:number('temp'+(i+1),v),s:number('speed'+(i+1),defaultsS[i])};});
  }
  function error(p,floor,limit) {
   if(!Number.isInteger(floor)||floor<5||floor>100) return '最低稳定输出需为 5–100% 的整数。';
   if(!Number.isInteger(limit)||limit<60||limit>100) return '强制全速温度需为 60–100°C 的整数。';
   for(var i=0;i<4;i++) {
    if(!Number.isInteger(p[i].t)||p[i].t<20||p[i].t>95) return '四个温度点需为 20–95°C 的整数。';
    if(!Number.isInteger(p[i].s)||p[i].s<floor||p[i].s>100) return '每个点的输出需介于最低稳定输出与 100% 之间。';
    if(i&&p[i].t<p[i-1].t+2) return '相邻温度点必须至少相隔 2°C，不能交叉。';
    if(i&&p[i].s<p[i-1].s) return '后一个点的输出不能低于前一个点。';
   }
   if(limit<p[3].t+2) return '强制全速温度至少应高于第四个点 2°C。';
   return '';
  }
  function sync() {
   var p=points();
   p.forEach(function(v,i){
    ['temp','speed'].forEach(function(k){
     var source=field(k+(i+1)); el('of-'+k+(i+1)).value=source ? source.value : (k==='temp'?v.t:v.s);
    });
   });
  }
  function render() {
   var p=points(),floor=number('min_speed',5),limit=number('emergency_temp',85),message=error(p,floor,limit);
   el('of-curve-error').textContent=message;
   p.forEach(function(v,i){
    ['temp','speed'].forEach(function(k){el('of-'+k+(i+1)).setCustomValidity(message);});
    var valid=Number.isFinite(v.t)&&Number.isFinite(v.s);
    handles[i].group.setAttribute('visibility',valid?'visible':'hidden');
    if(valid) {
     handles[i].circle.setAttribute('cx',x(v.t));handles[i].circle.setAttribute('cy',y(v.s));
     handles[i].circle.setAttribute('aria-valuenow',v.t);
     handles[i].circle.setAttribute('aria-valuetext',v.t+'°C，'+v.s+'%');
     handles[i].label.setAttribute('x',x(v.t));handles[i].label.setAttribute('y',y(v.s)+4);
    }
   });
   el('of-floor-line').setAttribute('d',Number.isFinite(floor)?'M62 '+y(floor)+'H716':'');
   el('of-safety-line').setAttribute('d',Number.isFinite(limit)?'M'+x(limit)+' 36V276':'');
   el('of-safety-label').setAttribute('x',Number.isFinite(limit)?x(limit)-5:716);
   el('of-safety-label').textContent=Number.isFinite(limit)?limit+'°C 全速保护':'';
   var stop=field('fan_stop'), stopped=stop ? stop.checked : true;
   var path='';
   if(!message) {
    path='M62 '+y(stopped?0:p[0].s)+'H'+x(p[0].t)+'V'+y(p[0].s);
    for(var i=1;i<4;i++) path+='L'+x(p[i].t)+' '+y(p[i].s);
    path+='H'+x(limit)+'V36H716';
   }
   el('of-curve-path').setAttribute('d',path);
   el('of-curve-fill').setAttribute('d',path?path+'V276H62Z':'');
   el('of-selected').textContent='基准点 '+(selected+1)+' · '+p[selected].t+'°C / '+p[selected].s+'%';
   el('of-curve-caption').textContent=message ? '请修正参数后再保存。' :
    (stopped?'低于 '+(p[0].t-2)+'°C 后逐步停转；回升至 '+p[0].t+'°C 起转。':'低于第一个点时保持 '+p[0].s+'% 输出。')+
    ' 超过第四个点后保持 '+p[3].s+'%，达到 '+limit+'°C 强制全速。';
  }
  function commit(i,t,s) {
   field('temp'+(i+1)).value=String(t);field('speed'+(i+1)).value=String(s);
   field('temp'+(i+1)).dispatchEvent(new Event('change',{bubbles:true}));
   field('speed'+(i+1)).dispatchEvent(new Event('change',{bubbles:true}));
   sync();render();
  }
  function move(i,t,s) {
   var p=points(),floor=number('min_speed',5),limit=number('emergency_temp',85);
   if(error(p,floor,limit)) return;
   t=Math.max(i?p[i-1].t+2:20,Math.min(i<3?p[i+1].t-2:Math.min(95,limit-2),Math.round(t)));
   s=Math.max(i?p[i-1].s:floor,Math.min(i<3?p[i+1].s:100,Math.round(s)));
   commit(i,t,s);
  }
  for(var i=0;i<4;i++) (function(i) {
   var g=node('g',{},el('of-points'));
   var c=node('circle',{r:12,'class':'of-handle',tabindex:0,role:'slider','aria-label':'基准点 '+(i+1),'aria-valuemin':20,'aria-valuemax':95},g);
   var label=node('text',{'text-anchor':'middle','pointer-events':'none',fill:'#0c8277'},g);label.textContent=i+1;
   handles.push({group:g,circle:c,label:label});
   c.addEventListener('focus',function(){selected=i;render();});
   c.addEventListener('pointerdown',function(e){selected=i;drag={index:i,id:e.pointerId};c.setPointerCapture(e.pointerId);c.focus();e.preventDefault();render();});
   c.addEventListener('pointermove',function(e){
    if(!drag||drag.id!==e.pointerId)return;
    var matrix=svg.getScreenCTM();if(!matrix)return;
    var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;pt=pt.matrixTransform(matrix.inverse());
    move(i,20+(pt.x-62)/8.175,(276-pt.y)/2.4);
   });
   function end(e){if(drag&&drag.id===e.pointerId){drag=null;if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId);}}
   c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
   c.addEventListener('lostpointercapture',function(){drag=null;});
   c.addEventListener('keydown',function(e){
    var p=points()[i],step=e.shiftKey?5:1;
    if(e.key==='ArrowLeft')p.t-=step;else if(e.key==='ArrowRight')p.t+=step;
    else if(e.key==='ArrowUp')p.s+=step;else if(e.key==='ArrowDown')p.s-=step;else return;
    e.preventDefault();move(i,p.t,p.s);
   });
   ['temp','speed'].forEach(function(k){
    el('of-'+k+(i+1)).addEventListener('input',function(){
     selected=i;field(k+(i+1)).value=this.value;
     field(k+(i+1)).dispatchEvent(new Event('change',{bubbles:true}));render();
    });
   });
  })(i);
  function external(e) {
   if(e.target===field('min_speed')||e.target===field('emergency_temp')||e.target===field('fan_stop'))render();
  }
  document.addEventListener('input',external);document.addEventListener('change',external);
  sync();render();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
<%+cbi/valuefooter%>
